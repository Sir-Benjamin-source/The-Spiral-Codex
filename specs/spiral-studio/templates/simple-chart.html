<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Chart — Spiral Studio</title>
  <style>
    :root {
      --bg: #0f1419; --surface: #1a2332; --text: #e7ecf3; --muted: #8b9bb4;
      --accent: #3d9cf0; --bar: #3d9cf0; --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 1.5rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    .sub { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--surface); border-radius: var(--radius); padding: 1.25rem;
      max-width: 560px;
    }
    svg { width: 100%; height: auto; display: block; }
    .legend {
      margin-top: 1rem; font-size: 0.85rem; color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>Simple Chart</h1>
  <p class="sub">Spiral Studio — pure SVG bar chart (no external libraries)</p>

  <div class="card">
    <svg id="chart" viewBox="0 0 400 220" role="img" aria-label="Bar chart"></svg>
    <div class="legend" id="legend"></div>
  </div>

  <script>
    // Sample series — replace with real data as needed
    const series = [
      { label: 'Business', value: 121.22 },
      { label: 'Personal', value: 6.75 },
      { label: 'Review', value: 129.00 }
    ];

    const svg = document.getElementById('chart');
    const legend = document.getElementById('legend');
    const W = 400, H = 220, pad = { t: 20, r: 20, b: 40, l: 48 };
    const max = Math.max(...series.map(s => s.value), 1);
    const barW = (W - pad.l - pad.r) / series.length * 0.6;
    const gap = (W - pad.l - pad.r) / series.length;

    // Y grid + labels
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + (H - pad.t - pad.b) * (1 - i / 4);
      const val = (max * i / 4).toFixed(0);
      svg.innerHTML += `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="#2a3548" stroke-width="1"/>`;
      svg.innerHTML += `<text x="${pad.l - 8}" y="${y + 4}" fill="#8b9bb4" font-size="11" text-anchor="end">${val}</text>`;
    }

    series.forEach((s, i) => {
      const x = pad.l + gap * i + (gap - barW) / 2;
      const h = (s.value / max) * (H - pad.t - pad.b);
      const y = H - pad.b - h;
      svg.innerHTML += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="var(--bar)" opacity="0.9"/>`;
      svg.innerHTML += `<text x="${x + barW / 2}" y="${H - pad.b + 16}" fill="#8b9bb4" font-size="11" text-anchor="middle">${s.label}</text>`;
    });

    legend.textContent = series.map(s => `${s.label}: ${s.value.toFixed(2)}`).join(' · ');
  </script>
</body>
</html>
