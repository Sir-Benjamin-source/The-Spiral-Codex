<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marker Board — Spiral Studio</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.25rem;
    }
    .sub {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      max-width: 720px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.15s, transform 0.1s;
    }
    .card:hover {
      border-color: #2a3548;
      transform: translateY(-1px);
    }
    .card.active {
      border-color: var(--accent);
    }
    .face {
      font-size: 1.5rem;
      margin-bottom: 0.35rem;
      letter-spacing: 0.02em;
    }
    .label {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .status {
      margin-top: 1.5rem;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border-radius: var(--radius);
      font-size: 0.9rem;
      color: var(--muted);
      max-width: 720px;
    }
  </style>
</head>
<body>
  <h1>Marker Board</h1>
  <p class="sub">Spiral Studio starter — click a marker to select status</p>

  <div class="grid" id="board"></div>
  <div class="status" id="status">No marker selected.</div>

  <script>
    const markers = [
      { face: '(·_·)', label: 'Quiet / routine' },
      { face: '(^_^)', label: 'Clean / anchors held' },
      { face: '(o.p)', label: 'Notable / examination' },
      { face: '(>_<)', label: 'Drift / incomplete' },
      { face: '(· ·)', label: 'Waiting / background' }
    ];

    const board = document.getElementById('board');
    const status = document.getElementById('status');
    let selected = null;

    markers.forEach((m, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `<div class="face">${m.face}</div><div class="label">${m.label}</div>`;
      el.addEventListener('click', () => {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        selected = m;
        status.textContent = `Selected: ${m.face} — ${m.label}`;
      });
      board.appendChild(el);
    });
  </script>
</body>
</html>
